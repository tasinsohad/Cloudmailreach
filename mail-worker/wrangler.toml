name = "cloud-mail"
main = "src/index.js"
compatibility_date = "2025-06-04"
keep_vars = true

[observability]
enabled = true

[[d1_databases]]
binding = "db"
database_name = "cloud-mail-db"
database_id = "e3bb6cd8-4c38-4539-bdaa-dba17ed5f050"

[[kv_namespaces]]
binding = "kv"
id = "bbade81c122642f5b753ae14fc047257"

[[send_email]]
name = "forward"

[ai]
binding = "ai"

[assets]
binding = "assets"
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = true

[triggers]
crons = ["0 9,18 * * *", "0 * * * *"]

